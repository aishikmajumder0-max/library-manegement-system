{% extends "base.html" %}
{% block title %}{{ 'Edit' if book else 'Add' }} Book | LibraPro{% endblock %}
{% block page_heading %}{{ 'Edit Book' if book else 'Add New Book' }}{% endblock %}
{% block content %}
<form method="post" class="form-card">
<div class="form-section"><h3>Book Information</h3><div class="form-grid">
<label>ISBN *<input name="isbn" value="{{ book.isbn if book else '' }}" required></label>
<label>Title *<input name="title" value="{{ book.title if book else '' }}" required></label>
<label>Author *<input name="author" value="{{ book.author if book else '' }}" required></label>
<label>Category *<input name="category" value="{{ book.category if book else '' }}" required></label>
<label>Publisher<input name="publisher" value="{{ book.publisher if book else '' }}"></label>
<label>Publication Year<input type="number" name="year" value="{{ book.year if book else '' }}" min="1000" max="2100"></label>
<label>Total Quantity *<input type="number" name="quantity" value="{{ book.quantity if book else 1 }}" min="1" required></label>
<label>Shelf / Rack<input name="shelf" value="{{ book.shelf if book else '' }}" placeholder="A-01"></label>
</div></div>
<div class="form-actions"><a class="btn" href="{{ url_for('books') }}">Cancel</a><button class="btn primary">Save Book</button></div>
</form>
{% endblock %}
